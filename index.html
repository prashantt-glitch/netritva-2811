function glow(cx, cy, r, rgb, a){
  if (a <= 0.002 || r <= 0) return;
  var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, 'rgba(' + rgb + ',1)');

function lerpHex(c1, c2, k){
  var r1=parseInt(c1.substr(1,2),16), g1=parseInt(c1.substr(3,2),16), b1=parseInt(c1.substr(5,2),16);

var SKYSTOP = [[0,'#0d0819'],[0.28,'#1a0e2c'],[0.50,'#3a1739'],[0.66,'#63203a'],

function skyAt(k){
  k = clampN(k,0,1);
  for (var i=1;i<SKYSTOP.length;i++){
    if (k <= SKYSTOP[i][0]){
      var a0=SKYSTOP[i-1], a1=SKYSTOP[i];
      return lerpHex(a0[1], a1[1], (k-a0[0])/(a1[0]-a0[0]));

   canvases and blitted each frame. Only things that actually move
   are drawn live. This is what keeps it smooth on a phone.
   ============================================================== */

var AC = null, sndOn = true, audioArmed = false;
function ac(){ if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = false; } } return AC; }
function armAudio(){
  audioArmed = true;
  var a = ac(); if (!a) return;
  if (a.state === 'suspended') a.resume();
}
function blip(f0, f1, dur, type, vol){
  if (!sndOn) return; var a = ac(); if (!a) return;
  if (a.state === 'suspended') a.resume();
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f0, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), a.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.055, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}

var MUS = { name:'', track:null, step:0, next:0 };
var MG = null;
function mg(){ var a = ac(); if (!a) return null; if (!MG){ MG = a.createGain(); MG.gain.value = 1; MG.connect(a.destination); } return MG; }
/* smooth volume moves, so nothing ever cuts off */
function musFade(v, secs){
  var g = mg(); if (!g) return; var a = ac(), now = a.currentTime;
  g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), now);
  g.gain.linearRampToValueAtTime(Math.max(0.0001, v), now + Math.max(0.02, secs));
}
function nf(n){ return 440 * Math.pow(2, (n - 69) / 12); }
function musNote(f, at, dur, type, vol){
  var a = ac(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(mg() || a.destination);
  o.start(at); o.stop(at + dur + 0.03);
}

function music(name){
  if (MUS.name === name) return;
  MUS.name = name || '';
  MUS.track = name ? TRACKS[name] : null;
  MUS.step = 0; MUS.next = 0;
}
function musicTick(){
  if (!audioArmed || !sndOn || !MUS.track) return;
  var a = ac(); if (!a) return;
  if (a.state === 'suspended'){ a.resume(); return; }
  var tr = MUS.track, now = a.currentTime;
  if (MUS.next < now) MUS.next = now + 0.06;
  var guard = 0;
  while (MUS.next < now + 0.28 && guard++ < 24){
    var i = MUS.step, n;
    n = tr.lead[i % tr.lead.length]; if (n) musNote(nf(n), MUS.next, tr.ld, 'square', 0.030);
    n = tr.bass[i % tr.bass.length]; if (n) musNote(nf(n), MUS.next, tr.bd, 'triangle', 0.052);
    if (tr.arp){ n = tr.arp[i % tr.arp.length]; if (n) musNote(nf(n), MUS.next, tr.ad, 'square', 0.014); }
    MUS.next += tr.spb; MUS.step = (MUS.step + 1) % 32;
  }
}

var cutT = 0, cutSfx = 0, cutBits = [];

/* draws the top (which=0) or bottom (which=1) half of a 16-tall sprite,
   at 2x, spinning about its own centre — the Among Us split */
function heroHalf(img, cx, cy, rot, which){
  var w = img.width, h = img.height;
  var oy = which === 0 ? h*0.75 : h*0.25;
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  ctx.rotate(rot);
  ctx.scale(2, 2);
  ctx.beginPath();
  if (which === 0) ctx.rect(-w/2, -h + oy, w, h/2);
  else ctx.rect(-w/2, -h/2 + oy, w, h/2);
  ctx.clip();
  ctx.drawImage(img, -w/2, -h + oy);
  ctx.restore();
}

function heroBig(img, x, footY, flip, sc){
  sc = sc || 2;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(footY));
  ctx.scale(flip ? -sc : sc, sc);
  ctx.drawImage(img[0], flip ? -img[0].width : 0, -img[0].height);
  ctx.restore();
}

function drawBigEye(k, t, pupil, charge){
  /* k = how far the lid is open, 0..1 */
  var CXe = 160, CYe = 66, WE = 76, HE = 34 * k;
  if (HE < 1) return;
  var i, h;
  /* halo + short spokes, like the mark */
  glow(CXe, CYe, 108, charge > 0.1 ? '255,110,70' : '242,193,74', (0.16 + charge*0.30) * k);
  ctx.globalAlpha = (0.20 + 0.10*Math.sin(t*2) + charge*0.35) * k;
  for (var a2=0; a2<24; a2++){
    var an = a2*Math.PI/12 + t*0.06;
    var len = 34 + (a2 % 3)*11;
    for (var r2=32; r2<32+len; r2+=2)
      R(CXe + Math.cos(an)*r2, CYe + Math.sin(an)*r2*0.68, 2, 2, charge > 0.1 ? '#ff7a4c' : C.gold);
  }
  ctx.globalAlpha = 1;
  /* sclera */
  for (i=-WE; i<=WE; i++){
    h = Math.round(Math.sqrt(Math.max(0, 1 - (i/WE)*(i/WE))) * HE);
    if (h < 1) continue;
    R(CXe+i, CYe-h, 1, h*2, '#efe9dc');
    R(CXe+i, CYe-h-1, 1, 1, '#2b2740');
    R(CXe+i, CYe+h, 1, 1, '#2b2740');
  }
  /* iris */
  var ir = Math.min(30, HE*0.92);
  for (i=-ir; i<=ir; i++){
    h = Math.round(Math.sqrt(Math.max(0, ir*ir - i*i)));
    if (h < 1) continue;
    R(CXe+i, CYe-h, 1, h*2, '#3b4157');
  }
  /* aperture blades, like the mark */
  for (var b=0; b<8; b++){
    var ba = b*Math.PI/4 + t*0.25;
    for (var rr=5; rr<ir; rr++) R(CXe + Math.cos(ba)*rr, CYe + Math.sin(ba)*rr, 1, 1, '#242a3d');
  }
  /* pupil */
  var pr = (7 + Math.sin(t*2.6)*1.2) * (1 + charge*0.7);
  for (i=-pr; i<=pr; i++){
    h = Math.round(Math.sqrt(Math.max(0, pr*pr - i*i)));
    if (h < 1) continue;
    R(CXe+i, CYe-h, 1, h*2, pupil);
  }
  R(CXe-3, CYe-4, 2, 2, '#cdefff');
  /* charging rings */
  if (charge > 0.02){
    for (var c2=0; c2<3; c2++){
      var rad = 90 - ((t*70 + c2*30) % 90) * (0.4 + charge);
      ctx.globalAlpha = charge * (1 - rad/90) * 0.9;
      for (var q=0; q<40; q++){
        var qa = q*Math.PI/20;
        R(CXe + Math.cos(qa)*rad, CYe + Math.sin(qa)*rad*0.7, 2, 2, '#ff8a5c');
      }
      ctx.globalAlpha = 1;
    }
  }
}

function drawCut(t){
  var k = cutT;
  CUTS = VW / 200; CUTOX = -60 * CUTS; CUTOY = Math.round(VH * 0.40 - 95 * CUTS);
  R(0, 0, VW, VH, '#07040d');

  var hx = 60, eye = 0, pupil = '#12151f', charge = 0, gone = false;

    var a = 1 - k/0.9;

    hx = 94; heroBig([S.hero.idle[0]], hx, 150, false);
    if (cutSfx < 1){ cutSfx = 1; blip(90, 220, 1.1, 'sawtooth', 0.05); }
  } else if (k < 2.15){
    eye = 1; hx = 94;
    heroBig([S.sword.up[0]], hx, 150, false);
    if (cutSfx < 2){ cutSfx = 2; blip(1400, 2600, 0.16, 'square', 0.05); }
  } else if (k < 2.8){
    eye = 1; hx = 94 + (k-2.15)/0.65*46;
    heroBig([S.sword.ready[0]], hx, 150, false);
    if (Math.random() < 0.4) parts.push({ x:hx+6, y:148, vx:-60-Math.random()*60, vy:-Math.random()*40,
                                          life:0.3, t:0, c:'#3a2f4a', s:1, ui:true });
  } else if (k < 3.15){
    eye = 1;
    var sl = (k-2.8)/0.35;
    hx = 140 + sl*8;
    var fy = 150 - Math.sin(Math.min(1, sl*1.4)*Math.PI)*34;
    heroBig([S.sword.lunge[0]], hx, fy, false);
    ctx.globalAlpha = Math.max(0, 1 - sl*1.3);
    for (var w2=0; w2<30; w2++){
      var wa = -2.0 + sl*0.55 + w2*0.052;
      R(160 + Math.cos(wa)*52, 78 + Math.sin(wa)*40, 3, 3, w2 % 3 ? '#ffffff' : '#cde6ff');
    }
    ctx.globalAlpha = 1;
    if (cutSfx < 3){
      cutSfx = 3; shake = 13; flash = 0.6;
      blip(2400, 260, 0.34, 'square', 0.075);
      for (var p2=0; p2<34; p2++)
        parts.push({ x:158, y:100, vx:(Math.random()-0.5)*300, vy:-Math.random()*220,
                     life:0.5+Math.random()*0.5, t:0, c: p2%2 ? '#ffffff' : C.gold,
                     s: Math.random()<0.4?2:1, ui:true });
    }
  } else if (k < 3.95){
    /* knocked back, the eye winds up */
    eye = 1; charge = clamp((k-3.15)/0.7, 0, 1);
    pupil = lerpHex('#12151f', '#ff3b22', charge);
    var kb = clamp((k-3.15)/0.35, 0, 1);
    hx = 148 - kb*24;
    heroBig([S.sword.cut[0]], hx, 150 - Math.sin((1-kb)*Math.PI)*18, false);
    if (cutSfx < 4){
      cutSfx = 4; blip(120, 900, 0.85, 'sawtooth', 0.06);
      for (var p3=0; p3<10; p3++)
        parts.push({ x:150, y:104, vx:-40-Math.random()*130, vy:-80-Math.random()*110,
                     life:0.8, t:0, c:'#c9d2dd', s:2, ui:true });
    }
  } else if (k < 4.22){
    /* the lance spears straight through him, and everything stops */
    eye = 1; charge = 1; pupil = '#ffffff';
    var LX = 142, LY = 134;                       /* dead centre of his chest */
    var sp = clamp((k-3.95)/0.09, 0, 1);          /* the lance shooting out */
    var tipx = 160 + (LX - 160)*sp, tipy = 66 + (LY - 66)*sp;
    var over = sp >= 1 ? 1 : 0;
    /* the lance itself */
    ctx.save();
    ctx.lineCap = 'butt';
    var ang = Math.atan2(LY - 66, LX - 160);
    ctx.translate(160, 66); ctx.rotate(ang);
    var len = Math.sqrt((LX-160)*(LX-160) + (LY-66)*(LY-66)) * sp + over*26;
    ctx.fillStyle = '#ffd98a'; ctx.fillRect(0, -2, len, 4);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, -1, len, 2);
    ctx.fillStyle = '#fff6de'; ctx.fillRect(len - 9, -3, 7, 6);
    ctx.restore();
    glow(tipx, tipy, 30, '255,240,200', 0.55);
    if (cutSfx < 5){
      cutSfx = 5; blip(2600, 900, 0.10, 'square', 0.07);
    }
    if (sp >= 1 && cutSfx < 6){
      cutSfx = 6; shake = 15; flash = 0.62;
      blip(900, 90, 0.4, 'sawtooth', 0.08);
      cutBits = [];
      for (var b2=0; b2<44; b2++)
        cutBits.push({ x:LX + (Math.random()-0.5)*16, y:LY - 2 + (Math.random()-0.5)*6,
                       vx:(Math.random()-0.5)*220, vy:-30-Math.random()*130, t:0,
                       c: b2 % 5 === 0 ? '#c2263a' : (b2 % 2 ? '#e8eef9' : C.gold) });
    }
    heroBig([S.sword.cut[0]], LX - 18, 150, false);
  } else if (k < 5.15){
    /* and then he comes apart in two pieces */
    eye = 1; charge = 1; pupil = '#ffffff';
    var q = clamp((k-4.22)/0.93, 0, 1);
    var e2 = q*q;
    /* the lance fades out */
    if (q < 0.3){
      ctx.globalAlpha = 1 - q/0.3;
      ctx.save();
      var ang2 = Math.atan2(132 - 66, 124 - 160);
      ctx.translate(160, 66); ctx.rotate(ang2);
      var len2 = Math.sqrt(36*36 + 66*66) + 26;
      ctx.fillStyle = '#ffd98a'; ctx.fillRect(0, -2, len2, 4);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    var img3 = S.sword.cut[0];
    /* top half spins off to the left and lands face down */
    heroHalf(img3, 142 - q*34, 126 - q*40 + e2*62, -q*3.0, 0);
    /* his legs are just left standing there */
    heroHalf(img3, 142 + q*4, 142, Math.min(0.35, q*0.5), 1);
    if (q > 0.55 && cutSfx < 7){ cutSfx = 7; shake = 5; blip(220, 90, 0.16, 'triangle', 0.05); }
    for (var c3=0; c3<cutBits.length; c3++){
      var bt = cutBits[c3];
      bt.t += 0.016; bt.x += bt.vx*0.016; bt.y += bt.vy*0.016; bt.vy += 260*0.016;
      if (bt.y > 152){ bt.y = 152; bt.vy = 0; bt.vx *= 0.7; }
      ctx.globalAlpha = Math.max(0, 1 - bt.t/1.6);
      R(bt.x, bt.y, 2, 2, bt.c);
      ctx.globalAlpha = 1;
    }
    gone = true;
  } else {
    /* the eye closes on what is left of him */
    eye = clamp(1 - (k-5.15)/0.45, 0, 1); charge = 1; pupil = '#ffffff'; gone = true;
    var img4 = S.sword.cut[0];
    heroHalf(img4, 146, 142, 0.35, 1);
    heroHalf(img4, 108, 148, -3.0, 0);
    for (var c4=0; c4<cutBits.length; c4++){
      var b4 = cutBits[c4];
      ctx.globalAlpha = Math.max(0, 1 - (b4.t + (k-5.15))/1.9);
      R(b4.x, b4.y, 2, 2, b4.c); ctx.globalAlpha = 1;
    }
    ctx.globalAlpha = clamp((k-5.25)/0.5, 0, 1);
    R(-400, -400, 1200, 1400, '#07040d'); ctx.globalAlpha = 1;
  }

  drawBigEye(eye, t, pupil, charge);

  /* live particles from the clash */
  for (var i=parts.length-1; i>=0; i--){
    var pa = parts[i]; pa.t += 0.016;
    if (pa.t > pa.life){ parts.splice(i,1); continue; }

    ctx.globalAlpha = Math.max(0, 1 - pa.t/pa.life);
    R(pa.x, pa.y, pa.s, pa.s, pa.c);

  ctx.restore();
  if (k < 1.0 && Math.floor(k*3) % 2 === 0) textC('SOMETHING IS WATCHING', Math.round(CUTOY + 172*CUTS), '#8a7fa0', 1, 1);

}

/* ---------- countdown ----------------------------------------- */
var TARGET = new Date('2026-11-28T00:00:00+05:30').getTime();
function p2(n){ return (n<10?'0':'') + n; }
function cdown(){
  var ms = Math.max(0, TARGET - Date.now()), s = Math.floor(ms/1000);
  return { d: Math.floor(s/86400), h: Math.floor(s/3600)%24, m: Math.floor(s/60)%60, s: s%60 };
}
function drawCountdown(y, t){
  var c = cdown();
  var str = p2(c.d) + ':' + p2(c.h) + ':' + p2(c.m) + ':' + p2(c.s);
  var w = textW(str, 2, 1), x0 = Math.round((VW - w)/2);
  /* the seconds column ticks warm */
  var ba = ctx.globalAlpha;
  text(str, x0, y, C.ui, 2, 1);
  ctx.globalAlpha = ba * (0.55 + 0.45*Math.abs(Math.sin(t*3.14159)));
  text(str.substr(9,2), x0 + 9*12, y, C.gold, 2, 1);
  ctx.globalAlpha = ba;
  var labs = ['DAYS','HRS','MIN','SEC'];
  for (var i=0; i<4; i++){
    var cxx = x0 + i*36 + 11;
    text(labs[i], Math.round(cxx - textW(labs[i],1,1)/2), y + 17, C.dim, 1, 1);
  }
}

function ease(k){ k = clamp(k, 0, 1); return k*k*(3 - 2*k); }
function easeOut(k){ k = clamp(k, 0, 1); return 1 - (1-k)*(1-k)*(1-k); }
function at(prev, now, t){ return prev < t && now >= t; }

/* ---------------- intro: the eye sleeps above a sealed door; he forces it open ---------------- */
var EYE_SLEEP_Y = 0;
function startIntro(){
  introT = 0; doorUp = true; heroSX = 156; heroFlip = true;
  eyeX = DOOR_X + DOOR_W/2; eyeOpen = 0; state = 'intro'; stateT = 0;
  music(null); musFade(1, 0.05);
  blip(55, 50, 2.5, 'sine', 0.06);
}
function skipIntro(){ if (introT < 4.0) introT = 4.0; }
function doorGap(){
  if (introT < 1.7) return 0;

/* ---------------- the reveal: the eye that killed him becomes the mark ---------------- */
function drawMorph(t, y, rgb){
  /* logo eye sits at (VW/2 - 1, y + 46) in the reveal layout; triangle apex (VW/2 + 2, y), base y + 69 */

  if (!morph) return;
  var k = ease(clamp(stateT / 1.5, 0, 1));
  var cx = morph.x + (ex - morph.x) * k, cy = morph.y + (ey - morph.y) * k;
  var W = morph.W + (27 - morph.W) * k, H = morph.H + (12 - morph.H) * k;
  var fade = 1 - clamp((stateT - 1.75) / 0.5, 0, 1);
  if (fade <= 0) return;
  ctx.globalAlpha = fade;
  /* rays: red, cooling to gold and pulling in */
  var rayCol = lerpHex('#ff6a4c', '#f2c14a', k);
  for (var a = 0; a < 18; a++){
    var an = a * Math.PI / 9 + t * 0.4 * (1 - k), len = (W * 0.9) * (1 - k * 0.6);
    for (var r = W * 0.95; r < W * 0.95 + len; r += Math.max(2, W / 10))
      R(cx + Math.cos(an) * r, cy + Math.sin(an) * r * 0.75, Math.max(1, W / 20), Math.max(1, W / 20), rayCol);
  }
  for (var i = -Math.round(W); i <= W; i++){
    var h = Math.round(Math.sqrt(Math.max(0, 1 - (i/W)*(i/W))) * H);
    if (h < 1) continue;
    R(cx + i, cy - h, 1, h * 2, lerpHex('#f3d6cf', '#efe9dc', k));
  }
  var ir = H * 0.78;
  for (i = -Math.round(ir); i <= ir; i++){ h = Math.round(Math.sqrt(Math.max(0, ir*ir - i*i))); if (h >= 1) R(cx + i, cy - h, 1, h * 2, '#3b4157'); }
  var pr = ir * (0.6 - 0.25 * k);
  for (i = -Math.round(pr); i <= pr; i++){ h = Math.round(Math.sqrt(Math.max(0, pr*pr - i*i))); if (h >= 1) R(cx + i, cy - h, 1, h * 2, lerpHex('#ff3b22', '#12151f', k)); }
  ctx.globalAlpha = 1;
  /* the triangle draws itself around it */
  var tk = clamp((stateT - 0.9) / 1.0, 0, 1);
  if (tk > 0){
    var P = [[VW/2 + 2, y + 1], [VW/2 - 48 + 92, y + 68], [VW/2 - 48 + 4, y + 68], [VW/2 + 2, y + 1]];
    var total = 3, drawn = tk * total;
    glow(VW/2, y + 46, 70, rgb, 0.18 * tk);
    for (var e = 0; e < 3; e++){
      var seg = clamp(drawn - e, 0, 1); if (seg <= 0) break;
      var x0 = P[e][0], y0 = P[e][1], x1 = P[e+1][0], y1 = P[e+1][1], n = 60;
      for (var j = 0; j <= n * seg; j++){ var u = j / n; R(x0 + (x1 - x0) * u - 1, y0 + (y1 - y0) * u - 1, 2, 2, '#f2c14a'); }
    }
  }
}

var BG = null;
function layout(){
  var iw = Math.max(1, innerWidth), ih = Math.max(1, innerHeight);

  VH = Math.round(clamp(VW * ih / iw, 240, 360));
  cv.width = VW; cv.height = VH;
  ctx.imageSmoothingEnabled = false;
  GY = VH - Math.round(clamp(VH * 0.2, 52, 74));
  var s = Math.min(iw / VW, ih / VH);
  cv.style.width  = Math.floor(VW * s) + 'px';
  cv.style.height = Math.floor(VH * s) + 'px';
  var dy = GY - oldGY;
  if (dy){
    hero.y += dy;
    var L = [imps, coins, fires, parts], i, j;
    for (i=0;i<L.length;i++) for (j=0;j<L[i].length;j++) L[i][j].y += dy;
  }
  bakeBG();
}

/* ---------- background, baked once per size ------------------- */
function bakeBG(){
  BG = { sky: newC(VW, GY), far: newC(VW*2, 90), mid: newC(VW*2, 70) };
  var g = BG.sky.getContext('2d');
  for (var y=0; y<GY; y++){ rc(g, 0, y, VW, 1, skyAt(y / GY)); }
  for (var i=0; i<70; i++){
    var sx = Math.floor(hash(i*7+1)*VW), sy = Math.floor(hash(i*13+5)*GY*0.6);
    rc(g, sx, sy, 1, 1, hash(i*3) > 0.8 ? '#ffffff' : '#bcb3d6');
  }
  /* far hills */
  g = BG.far.getContext('2d');
  for (var x=0; x<VW*2; x++){
    var h = 34 + Math.sin(x*0.031)*14 + Math.sin(x*0.083+1.7)*7 + Math.sin(x*0.011)*10;
    rc(g, x, 90 - h, 1, h, C.far);
    if (hash(x*5) > 0.985) rc(g, x, 90 - h - 3, 1, 3, C.farL);
  }
  /* near trees and huts */
  g = BG.mid.getContext('2d');
  for (x=0; x<VW*2; x+=1){
    var b = 12 + Math.sin(x*0.05)*4;
    rc(g, x, 70 - b, 1, b, C.mid);
  }
  for (i=0; i<14; i++){
    var tx = Math.floor(hash(i*31+9) * (VW*2 - 12)), th = 18 + Math.floor(hash(i*17)*16);
    for (var r=0; r<th; r++){ var w = Math.max(1, Math.round((r/th)*9)); rc(g, tx + 6 - w/2, 70 - 10 - th + r, w, 1, C.tree); }
    rc(g, tx + 5, 70 - 12, 2, 4, C.trunk);
  }
  for (i=0; i<4; i++){
    var hx = Math.floor(hash(i*91+3) * (VW*2 - 24));
    rc(g, hx, 70 - 24, 20, 14, C.mid); for (r=0; r<8; r++) rc(g, hx - 2 + r, 70 - 24 - r, 24 - r*2, 1, C.mid);
    rc(g, hx + 7, 70 - 20, 3, 3, hash(i) > 0.3 ? C.win : C.winD);
  }
}
function tileX(img, off, y){
  var w = img.width, x = -(((off % w) + w) % w);
  ctx.drawImage(img, Math.round(x), y); ctx.drawImage(img, Math.round(x + w), y);
}

/* ---------- state ---------------------------------------------- */
var state = 'title';               /* title | play | dead | over | outro | cut | win | secret */
var outT = 0, outV = 0;
var eyeX = -40, eyeOpen = 0, lungeT = -1;
var camX = 0, dist = 0, speed = 95, runT = 0, stateT = 0;
var kills = 0, nCoins = 0, secretFound = false, runs = 0, lives = 3;
var hero = { y:0, vy:0, w:8, h:14, ground:true, jumps:0, alive:true, anim:0, inv:0, sq:1, coyote:0 };
var segs = [], imps = [], coins = [], fires = [], parts = [], pops = [];
var genX = 0, dragT = -1, nextDrag = 0, shake = 0, flash = 0;
var hint = '', hintT = 0, hintsShown = {};

var rs = 1;
function rnd(){ rs = (rs * 16807) % 2147483647; return (rs - 1) / 2147483646; }


function newRun(){
  rs = (Date.now() % 2147483646) + 1;
  camX = 0; dist = 0; speed = 85; runT = 0; kills = 0; nCoins = 0; secretFound = false; lives = 3; eyeX = -40; eyeOpen = 0; lungeT = -1;
  hero.y = GY - hero.h; hero.vy = 0; hero.ground = true; hero.jumps = 0; hero.alive = true; hero.inv = 0; hero.sq = 1;
  segs = [{ a:-200, b:340 }]; imps = []; coins = []; fires = []; parts = []; pops = [];
  genX = 340; dragT = -1; nextDrag = 24; shake = 0; flash = 0; hint = ''; hintT = 0;
  /* the whole run is laid out up front: random, but always the same length */
  while (genX < RUN_END - 150) gen();
  runFor(RUN_END + 900 - genX);
  /* every run gets 12-14 coins; the extra ones sit high, so getting them all takes timing */
  var tries = 0;
  while (coins.length < 12 && tries++ < 200){
    var cx = 500 + rnd() * (RUN_END - 900);
    if (!groundAt(cx) || !groundAt(cx + 20)) continue;
    var clash = false; for (var ci=0; ci<coins.length; ci++) if (Math.abs(coins[ci].x - cx) < 30) clash = true;
    if (clash) continue;
    coins.push({ x: cx, y: GY - 58 - Math.round(rnd()*8), got:false, ph:rnd()*6 });
  }
  while (coins.length > 14) coins.splice(Math.floor(rnd() * coins.length), 1);
  TOTAL = coins.length;
}

/* ---------- level generation: one chunk at a time --------------- */
function lastSeg(){ return segs[segs.length - 1]; }
function runFor(len){ genX += len; lastSeg().b = genX; }
function coinRow(x, n, y){ for (var i=0; i<n; i++) coins.push({ x:x + i*13, y:y, got:false, ph:rnd()*6 }); }
function gen(){
  var m = genX / 8;                 /* meters at this point */
  var sp = 85 + Math.min(40, genX * 0.0085);
  var safe = sp * 0.5 + rnd() * 35;
  var r = rnd();
  if (m < 25){                      /* warm up: ground and a few coins */
    runFor(90); if (genX > 500 && genX < 600) coinRow(genX - 70, 3, GY - 22); return;
  }
  if (r < 0.34){                    /* a gap, with coins arcing over it */
    var gw = Math.round(18 + rnd() * Math.min(16, 6 + m * 0.03));
    var gx = genX;
    genX += gw; segs.push({ a:genX, b:genX });
    if (rnd() < 0.4) for (var i=0; i<3; i++){
      var k = (i + 0.5) / 3; coins.push({ x: gx - 10 + k*(gw + 20), y: GY - 26 - Math.sin(k*Math.PI)*22, got:false, ph:i });
    }
    runFor(safe);
  } else if (r < 0.68){             /* an imp walking at you */
    runFor(30);
    imps.push({ x: genX, y: GY - 14, w: 10, h: 12, vx: -12 - Math.min(8, m * 0.012), alive:true, flat:0, anim:rnd()*4, seg: lastSeg() });
    if (m > 380 && rnd() < 0.2)
      imps.push({ x: genX + 22, y: GY - 14, w: 10, h: 12, vx: -16, alive:true, flat:0, anim:rnd()*4, seg: lastSeg() });
    if (rnd() < 0.3) coinRow(genX - 4, 2, GY - 44);
    runFor(safe + 20);
  } else if (r < 0.86 && m > 100){  /* a fireball rolling along the ground */
    runFor(20);
    fires.push({ x: genX, y: GY - 9, vx: -55 - Math.min(40, m*0.03), vy:0, live:false, t:0 });
    runFor(safe + 30);
  } else {                          /* breather with a coin line, sometimes high */
    var hi = rnd() < 0.4;
    runFor(40); if (rnd() < 0.7) coinRow(genX - 30, hi ? 3 : 2, hi ? GY - 62 : GY - 22);
    runFor(safe * 0.6);
  }
}

/* ---------- input: the whole screen is the button --------------- */
var down = false;
function press(){
  armAudio();
  if (state === 'title'){ startRun(); return; }
  if (state === 'over'){ if (stateT > 1.2){ startRun(); } return; }
  if (state === 'win' || state === 'secret'){ if (stateT > 4.2){ snap = null; morph = null; startRun(); } return; }
  if (state === 'intro'){ skipIntro(); return; }
  if (state === 'cut' || state === 'outro' || state === 'kill') return;
  if (state !== 'play' || !hero.alive) return;
  if (hero.ground || (hero.coyote > 0 && hero.jumps === 0)){
    hero.vy = -318; hero.ground = false; hero.jumps = 1; hero.coyote = 0; hero.sq = 0.75; SFX.jump();
    puff(HX + 4, GY, 4, '#b9a98c', 40);
  } else if (hero.jumps < 2){
    hero.vy = -270; hero.jumps = 2; hero.sq = 0.8; SFX.jump(); puff(HX + 4, hero.y + hero.h, 6, '#cde6ff', 60);
    if (hintsShown.dbl !== true){ hintsShown.dbl = true; }
  }
}
function release(){
  if (state === 'play' && hero.alive && hero.vy < -120) hero.vy *= 0.5;   /* short tap = small hop */
}
function startRun(){ runs++; newRun(); startIntro(); }

cv.addEventListener('touchstart', function(e){ e.preventDefault(); if (!down){ down = true; press(); } }, { passive:false });
cv.addEventListener('touchend',   function(e){ e.preventDefault(); down = false; release(); }, { passive:false });
cv.addEventListener('touchcancel',function(e){ down = false; }, { passive:false });
document.body.addEventListener('touchstart', function(e){ if (e.target !== cv){ e.preventDefault(); if (!down){ down = true; press(); } } }, { passive:false });
document.body.addEventListener('touchend', function(e){ if (e.target !== cv){ down = false; release(); } }, { passive:false });
addEventListener('mousedown', function(){ if (!touch){ press(); } });
addEventListener('mouseup',   function(){ if (!touch){ release(); } });
addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter'){
    e.preventDefault(); if (!e.repeat) press();
  }
  if (e.code === 'KeyM'){ sndOn = !sndOn; }
}, { passive:false });
addEventListener('keyup', function(e){ if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') release(); });
addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------- helpers --------------------------------------------- */
function groundAt(wx){
  for (var i=0; i<segs.length; i++){ var s = segs[i]; if (wx >= s.a && wx <= s.b) return true; }
  return false;
}
function puff(x, y, n, col, spd){
  for (var i=0; i<n; i++)
    parts.push({ x:x, y:y, vx:(Math.random()-0.5)*(spd||70), vy:-Math.random()*(spd||70)*0.8,
                 life:0.35 + Math.random()*0.4, t:0, c:col, s: Math.random()<0.4?2:1 });
}
function pop(txt, x, y, col){ pops.push({ s:txt, x:x, y:y, t:0, c:col || C.gold }); }
function showHint(key, txt, dur){ if (hintsShown[key]) return; hintsShown[key] = true; hint = txt; hintT = dur || 2.6; }
function die(fell){
  if (!hero.alive || (hero.inv > 0 && !fell)) return;
  if (lives > 1){
    lives--; hero.inv = 1.8; SFX.hurt(); shake = 5; flash = 0.25;
    pop('IT GAINS', HX - 10, hero.y - 14, '#ff9a86'); blip(110, 60, 0.4, 'sawtooth', 0.06);
    if (fell){
      /* drop him back in on the next solid ground */
      var wx = camX + HX;
      for (var i=0; i<segs.length; i++) if (segs[i].a > wx - 2){ camX = segs[i].a + 4 - HX; dist = camX; break; }
      hero.y = GY - hero.h - 30; hero.vy = 0; hero.ground = false; hero.jumps = 1;
    }
    return;
  }
  hero.alive = false; hero.vy = -220; state = 'dead'; stateT = 0; SFX.hurt(); shake = 6; flash = 0.3;
  musFade(0, 0.8);
}

/* ---------- update ---------------------------------------------- */
function update(dt){
  if (state === 'intro'){ updateIntro(dt); return; }
  if (state === 'kill'){ updateKill(dt); return; }
  if (state === 'play') runT += dt;
  if (state === 'outro'){
    outT += dt;
    var ok = clamp(outT / 0.9, 0, 1);
    var sp = outV * (1 - ok) * (1 - ok);
    eyeX += (HX + 4 - eyeX) * Math.min(1, dt * 6);
    camX += sp * dt; dist += sp * dt; hero.anim += sp * dt * 0.09;
    hero.y = GY - hero.h; hero.vy = 0; hero.ground = true;
    shake = 3 + ok * 3;
    for (var pi=parts.length-1; pi>=0; pi--){ var pp = parts[pi]; pp.t += dt; if (pp.t > pp.life){ parts.splice(pi,1); continue; } pp.vy += 260*dt; pp.x += pp.vx*dt; pp.y += pp.vy*dt; }
    if (outT >= 1.1){
      state = 'cut'; cutT = 0; cutSfx = 0; cutBits = []; parts = []; shake = 0; flash = 0;
      music('boss'); musFade(0.0001, 0.01); musFade(0.75, 1.2);
    }
    return;
  }
  if (state === 'cut'){
    var pc = cutT; cutT += dt;
    if (pc < 3.9 && cutT >= 3.9) musFade(0.0001, 0.12);      /* silence right before the strike */
    if (pc < 4.6 && cutT >= 4.6){ music(null); }
    if (cutT > 5.75){
      state = (nCoins >= TOTAL && TOTAL > 0) ? 'secret' : 'win'; stateT = 0;
      music('end'); musFade(0.0001, 0.01); musFade(0.9, 2.5); boom();
      if (state === 'secret'){ secretFound = true; everFound = true; saveBest(); SFX.secret(); } else SFX.win();
    }
    return;
  }
  speed = 85 + 0.9 * Math.min(runT, RUN_TIME);
  if (state === 'play'){
    var dx = speed * dt;
    camX += dx; dist += dx;
    if (runT >= RUN_TIME - 1.3 && lungeT < 0 && hero.alive){
      lungeT = 0; hero.inv = 9; musFade(0.0001, 1.2); heartbeat(); blip(70, 40, 1.6, 'sawtooth', 0.06);
      for (var fi = fires.length - 1; fi >= 0; fi--) if (fires[fi].x - camX < VW + 20) fires.splice(fi, 1);
    }
    if (lungeT >= 0) lungeT += dt;
    if (runT >= RUN_TIME && hero.alive){
      startKill();
      return;
    }
  }
  var wx = camX + HX;              /* hero world x */
  /* the eye: opens in the first second, then holds a distance set by how many times he stumbled */
  if (state === 'play' || state === 'dead'){
    eyeOpen = Math.min(1, eyeOpen + dt * 1.2);
    var target = [30, 28, 14, 2][lives] + Math.sin(runT * 1.7) * 3;
    if (state === 'dead') target = HX + 2;
    if (lungeT >= 0) target = 2 + (HX - 30) * Math.min(1, lungeT / 1.3);
    eyeX += (target - eyeX) * Math.min(1, dt * (state === 'dead' || lungeT >= 0 ? 5 : 2.2));
  }

  /* hero */
  if (state === 'play'){
    if (hero.inv > 0) hero.inv -= dt;
    var onG = groundAt(wx + 1) || groundAt(wx + hero.w - 1);
    if (hero.ground){
      if (!onG){ hero.ground = false; hero.coyote = 0.09; hero.jumps = 0; }
      else { hero.y = GY - hero.h; hero.vy = 0; }
    }
    if (!hero.ground){
      if (hero.coyote > 0) hero.coyote -= dt;
      hero.vy += (hero.vy < 0 ? 900 : 1150) * dt;
      if (hero.vy > 420) hero.vy = 420;
      var ny = hero.y + hero.vy * dt;
      if (hero.vy >= 0 && hero.y + hero.h <= GY + 1 && ny + hero.h >= GY && onG){
        ny = GY - hero.h; hero.vy = 0; hero.ground = true; hero.jumps = 0; hero.sq = 1.25;
        puff(HX + 4, GY, 3, '#b9a98c', 30);
      }
      hero.y = ny;
    }
    hero.sq += (1 - hero.sq) * Math.min(1, dt * 12);
    hero.anim += speed * dt * 0.09;
    if (hero.y > GY + 26){ die(true); }
    /* fell into a gap and ran into its far wall */
    if (hero.alive && hero.y + hero.h > GY + 3 && groundAt(wx + hero.w + 1)){ die(true); }
  } else if (state === 'dead'){
    stateT += dt; hero.vy += 900 * dt; hero.y += hero.vy * dt;
    if (stateT > 1.0){ state = 'over'; stateT = 0; music('end'); musFade(0.8, 1.5);
      if (runT > best){ best = runT; } saveBest(); }
  } else { stateT += dt; return; }

  /* imps */
  for (var i=imps.length-1; i>=0; i--){
    var e = imps[i];
    if (e.x < camX - 40){ imps.splice(i,1); continue; }
    if (!e.alive){ e.flat -= dt; if (e.flat <= 0) imps.splice(i,1); continue; }
    if (e.x < camX + VW + 10){
      e.x += e.vx * dt; e.anim += dt * 6;
      if (e.x < e.seg.a + 2){ e.x = e.seg.a + 2; e.vx = Math.abs(e.vx); }
      if (e.x + e.w > e.seg.b - 2){ e.x = e.seg.b - 2 - e.w; e.vx = -Math.abs(e.vx); }
    }
    if (state === 'play' && hero.alive && e.x < wx + hero.w && e.x + e.w > wx &&
        hero.y < e.y + e.h && hero.y + hero.h > e.y + 1){
      if (hero.vy > 30 && hero.y + hero.h - e.y < 10){
        e.alive = false; e.flat = 0.5; kills++; hero.vy = -250; hero.jumps = 1; SFX.stomp();
        puff(e.x - camX + 5, e.y + 4, 12, '#ff6a3c', 110); pop('+25', e.x - camX, e.y - 8); shake = 2;
      } else if (hero.inv <= 0) die();
    }
    if (state === 'play' && e.alive && e.x - camX < VW - 30 && kills === 0) showHint('stomp', 'JUMP ON ITS HEAD', 2.4);
  }

  /* fireballs */
  for (i=fires.length-1; i>=0; i--){
    var f = fires[i];
    if (!f.live){ if (f.x < camX + VW + 6) f.live = true; else continue; }
    f.t += dt; f.x += f.vx * dt;
    if (f.vy){ f.y += f.vy * dt; if (f.y >= GY - 9){ f.y = GY - 9; f.vy = 0; } }
    if (f.x < camX - 30){ fires.splice(i,1); continue; }
    if (state === 'play' && hero.alive && hero.inv <= 0){
      var cx = f.x + 4, cy = f.y + 4, hx0 = wx + 1, hy0 = hero.y + 2;
      if (cx > hx0 - 3 && cx < hx0 + hero.w + 2 && cy > hy0 - 2 && cy < hy0 + hero.h) die();
    }
    if (state === 'play' && f.x - camX < VW - 20) showHint('fire', 'JUMP OVER THE FIRE', 2.2);
  }

  /* coins */
  for (i=coins.length-1; i>=0; i--){
    var c = coins[i];
    if (c.x < camX - 20){ coins.splice(i,1); continue; }
    if (c.got || state !== 'play' || !hero.alive) continue;
    if (c.x < wx + hero.w + 2 && c.x + 9 > wx - 2 && c.y < hero.y + hero.h + 2 && c.y + 9 > hero.y - 2){
      c.got = true; nCoins++; SFX.pick(); puff(c.x - camX + 4, c.y + 4, 6, C.gold, 70);
    }
  }

  /* particles, pops */
  for (i=parts.length-1; i>=0; i--){
    var p = parts[i]; p.t += dt; if (p.t > p.life){ parts.splice(i,1); continue; }
    p.vy += 260*dt; p.x += p.vx*dt; p.y += p.vy*dt;
  }
  for (i=pops.length-1; i>=0; i--){ pops[i].t += dt; pops[i].y -= 18*dt; if (pops[i].t > 0.9) pops.splice(i,1); }
  if (hintT > 0) hintT -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt*24);
  if (flash > 0) flash = Math.max(0, flash - dt*2);

  /* trim old ground */
  while (segs.length > 2 && segs[0].b < camX - 60) segs.shift();

  /* first-run tips */
  if (state === 'play' && runT < 5) showHint('tap', 'TAP ANYWHERE TO JUMP', 3);
  if (state === 'play' && runT > 3.5 && runT < 7) showHint('run', 'DON\'T LET IT CATCH YOU', 2.4);
  if (state === 'play'){
    for (var g=0; g<segs.length-1; g++){
      var gs = segs[g].b - camX;
      if (gs > HX + 30 && gs < VW - 10 && runs <= 2){ showHint('gap', 'TAP TWICE TO JUMP HIGHER', 2.4); break; }
    }
  }
}
function heartbeat(){ blip(90, 45, 0.22, 'sine', 0.16); setTimeout(function(){ blip(80, 40, 0.2, 'sine', 0.12); }, 170); }
function boom(){ blip(140, 30, 1.2, 'sawtooth', 0.07); blip(60, 30, 1.4, 'sine', 0.18); }
function dragX(){ var k = dragT / 7.5; return VW + 10 - (VW + 80) * k; }
function dragY(){ return Math.max(16, GY - 150) + Math.sin(dragT * 2.4) * 6; }

/* ---------- draw ------------------------------------------------- */
function drawBack(t){
  ctx.drawImage(BG.sky, 0, 0);
  tileX(BG.far, camX * 0.12, GY - 90 + 6);
  tileX(BG.mid, camX * 0.35, GY - 70 + 2);
}
function drawGround(){
  for (var i=0; i<segs.length; i++){
    var s = segs[i], x0 = Math.max(s.a - camX, -2), x1 = Math.min(s.b - camX, VW + 2);
    if (x1 <= x0) continue;
    R(x0, GY, x1 - x0, VH - GY, C.dirt);
    R(x0, GY, x1 - x0, 3, C.grass); R(x0, GY, x1 - x0, 1, C.grassL);
    R(x0, GY + 3, x1 - x0, 2, C.dirtD);
    for (var px = Math.floor((s.a > camX ? s.a : camX) / 7) * 7; px < Math.min(s.b, camX + VW); px += 7){
      var hh = hash(px);
      if (px - camX < x0) continue;
      if (hh > 0.55) R(px - camX, GY + 8 + Math.floor(hh*30), 2, 1, C.pebble);
      if (hh > 0.8) R(px - camX + 3, GY + 20 + Math.floor(hash(px+3)*30), 1, 1, C.dirtD);
      if (hh < 0.18) R(px - camX + 2, GY - 2, 1, 2, C.grassL);
    }
    /* cliff edges */
    if (s.a - camX > -2) R(s.a - camX, GY, 1, VH - GY, C.dirtD);
    if (s.b - camX < VW + 2) R(s.b - camX - 1, GY, 1, VH - GY, C.dirtD);
  }
}
function drawEnt(t){
  var i;
  for (i=0; i<coins.length; i++){
    var c = coins[i]; if (c.got) continue;
    var px = c.x - camX; if (px < -12 || px > VW + 12) continue;
    var bob = Math.sin(t*3 + c.ph) * 1.5;
    glow(px + 4, c.y + 4 + bob, 10, '242,193,74', 0.28);
    var spin = Math.cos(t*4 + c.ph*1.3);
    ctx.save(); ctx.translate(Math.round(px) + 4.5, Math.round(c.y + bob) + 4.5);
    ctx.scale(Math.max(0.16, Math.abs(spin)), 1); ctx.drawImage(S.reel, -4.5, -4.5); ctx.restore();
  }
  for (i=0; i<imps.length; i++){
    var e = imps[i], ex = e.x - 2 - camX; if (ex < -20 || ex > VW + 20) continue;
    if (!e.alive){ ctx.globalAlpha = Math.max(0, e.flat * 2); spr(S.min.flat, ex, e.y - 2, e.vx > 0); ctx.globalAlpha = 1; continue; }
    spr((Math.floor(e.anim) % 2) ? S.min.walk1 : S.min.walk0, ex, e.y - 2, e.vx > 0);
  }
  for (i=0; i<fires.length; i++){
    var f = fires[i]; if (!f.live) continue;
    var fx = f.x - camX, fy = f.y;
    glow(fx + 4, fy + 4, 12, '255,120,40', 0.45);
    var fl = Math.floor(t * 14) % 2;
    R(fx + 1, fy + 1, 7, 7, C.fire[3]); R(fx + 2, fy + 2, 5, 5, C.fire[2]);
    R(fx + 3, fy + 3, 3, 3, C.fire[1]); R(fx + 3 + fl, fy + 3, 1, 1, C.fire[0]);
    R(fx + 8, fy + 3 + fl, 3, 2, C.fire[2]); R(fx + 11, fy + 4, 2, 1, C.fire[3]);
  }
  /* hero */
  if (state !== 'kill'){
    var hi;
    if (!hero.alive) hi = S.hero.hurt;
    else if (!hero.ground && state !== 'title') hi = hero.vy < -20 ? S.hero.jump : S.hero.fall;
    else if (state === 'intro' && introT > 1.7 && introT < 3.9) hi = S.hero.idle;
    else hi = [S.hero.run0, S.hero.run1, S.hero.run2, S.hero.run3][Math.floor(hero.anim) % 4];
    var blink = hero.inv > 0 && lungeT < 0 && Math.floor(hero.inv * 16) % 2 === 0;
    if (!blink){
      if (Math.abs(hero.sq - 1) > 0.03){
        ctx.save(); ctx.translate(heroSX + 4, hero.y + hero.h);
        ctx.scale(1 / hero.sq, hero.sq); ctx.drawImage(hi[heroFlip ? 1 : 0], -6, -16); ctx.restore();
      } else spr(hi, heroSX - 2, hero.y - 2, heroFlip);
    }
  }
  for (i=0; i<parts.length; i++){
    var p = parts[i]; ctx.globalAlpha = Math.max(0, 1 - p.t/p.life);
    R(p.x, p.y, p.s, p.s, p.c);
  }
  ctx.globalAlpha = 1;
  for (i=0; i<pops.length; i++){
    var q = pops[i]; ctx.globalAlpha = Math.max(0, 1 - q.t/0.9); text(q.s, Math.round(q.x), Math.round(q.y), q.c, 1, 1);
  }
  ctx.globalAlpha = 1;
}
function drawHUD(t){
  ctx.drawImage(S.reel, 5, 5);
  text(nCoins + '/' + TOTAL, 17, 6, nCoins >= TOTAL ? C.gold : C.ui, 1, 1);
  /* seconds until it catches him */
  var left = Math.max(0, Math.ceil(RUN_TIME - runT)), lt = String(left);
  text(lt, VW - 5 - textW(lt, 1, 1), 6, left <= 10 ? C.gold : C.ui, 1, 1);
  var bx = 62, bw = VW - bx - 22, k = clamp(runT / RUN_TIME, 0, 1);
  R(bx, 8, bw, 3, '#2a2040'); R(bx, 8, Math.round(bw * k), 3, C.gold);
  R(bx + bw - 1, 6, 3, 7, '#efe9dc'); R(bx + bw, 8, 1, 3, '#12151f');
}

function drawTitle(t){
  ctx.globalAlpha = 0.74; R(0, 0, VW, VH, '#0a0710'); ctx.globalAlpha = 1;
  var y0 = Math.round(GY * 0.16);
  var bob = Math.sin(t*1.6) * 1.5;
  textC('THE 28.11', y0 + bob, C.ui, 2, 1);
  textC('RUN', y0 + 18 + bob, C.gold, 2, 1);
  var y = y0 + 46;
  textC('SOMETHING IS BEHIND YOU.', y, C.dim, 1, 1); y += 10;
  textC('EACH HIT, IT GETS CLOSER.', y, C.dim, 1, 1); y += 16;
  /* a finger tapping */
  var tapk = (t * 1.4) % 1, fx = VW/2 - 4, fy = y + (tapk < 0.25 ? 2 : 0);
  R(fx + 2, fy, 4, 9, C.ui); R(fx, fy + 7, 8, 8, C.ui); R(fx + 8, fy + 9, 2, 4, C.ui);
  if (tapk < 0.25){ ctx.globalAlpha = 1 - tapk*4; R(fx - 6, y - 2, 2, 2, C.gold); R(fx + 12, y - 2, 2, 2, C.gold); R(fx + 3, y - 7, 2, 2, C.gold); ctx.globalAlpha = 1; }
  y += 26;
  textC('TAP ANYWHERE = JUMP', y, C.ui, 1, 1); y += 11;
  textC('TAP AGAIN IN AIR = HIGHER', y, C.ui, 1, 1); y += 11;
  textC('LAND ON THEIR HEADS', y, C.ui, 1, 1); y += 11;
  textC('JUMP THE GAPS AND FIRE', y, C.ui, 1, 1); y += 16;
  textC('GET EVERY COIN', y, C.gold, 1, 1); y += 10;
  textC('TO FIND THE HIDDEN ROOM', y, C.gold, 1, 1); y += 18;
  if (Math.floor(t*1.8) % 2 === 0) textC(touch ? 'TAP TO START' : 'PRESS SPACE', y, C.ui, 1, 1);
  textC(everFound ? 'YOU HAVE SEEN THE ROOM' : 'IIM BODH GAYA', VH - 14, everFound ? C.gold : '#4c4166', 1, 1);
}
function fin(t0, d){ return clamp((stateT - t0) / d, 0, 1); }
function embers(t, rgb){
  for (var i=0; i<34; i++){
    var sp = 10 + hash(i*7)*22, x = hash(i*13)*VW + Math.sin(t*0.8 + i)*4;
    var y = VH - ((t*sp + hash(i*3)*VH) % (VH + 20));
    ctx.globalAlpha = (0.25 + 0.5*hash(i*5)) * fin(0.3, 1.5);
    R(x, y, hash(i) > 0.7 ? 2 : 1, hash(i) > 0.7 ? 2 : 1, 'rgb(' + rgb + ')');
  }
  ctx.globalAlpha = 1;
}
var REV = 0.9;        /* everything after the logo lands is pushed back by this much */
function endTop(t, rgb){
  R(0, 0, VW, VH, '#07040d');
  var y = Math.max(4, Math.round((VH - 280) / 2));
  var gl = 0.5 + 0.5*Math.sin(t*1.4);
  glow(VW/2, y + 46, 40 + 60*fin(0.6, 1.4), rgb, 0.30*fin(0.6, 1.2)*(0.6+gl*0.6));
  if (stateT > 1.6) embers(t, rgb);
  drawMorph(t, y, rgb);
  /* the real mark takes its place */
  var lk = fin(1.7, 0.6);
  if (logoReady && lk > 0){ ctx.globalAlpha = lk; ctx.drawImage(LOGO, Math.round(VW/2 - 48), y); ctx.globalAlpha = 1; }
  var fl = clamp(1 - Math.abs(stateT - 2.2) / 0.25, 0, 1);
  if (fl > 0){ ctx.globalAlpha = fl * 0.3; R(0, 0, VW, VH, '#fff6de'); ctx.globalAlpha = 1; }
  return y + 100;
}
function tapLine(txt, d){
  d = d || 3.2;
  if (stateT > d && Math.floor(perf*1.8) % 2 === 0){ ctx.globalAlpha = fin(d, 0.4); textC(touch ? txt : 'PRESS SPACE', VH - 16, C.ui, 1, 1); }
  ctx.globalAlpha = 1;
}
function mmss(sec){ sec = Math.floor(sec); return Math.floor(sec/60) + ':' + (sec%60 < 10 ? '0' : '') + (sec%60); }
function drawOver(t){
  R(0, 0, VW, VH, '#07040d');
  ctx.globalAlpha = Math.min(1, stateT / 0.5);
  var y = Math.round(VH * 0.30);
  textC('IT CAUGHT YOU', y, '#ff9a86', 2, 1); y += 20;
  textC('AT ' + mmss(runT) + ' OF ' + mmss(RUN_TIME), y, C.ui, 1, 1); y += 10;
  var bw = 110, bx = Math.round((VW - bw)/2), k = clamp(runT / RUN_TIME, 0, 1);
  R(bx, y, bw, 4, '#2a2040'); R(bx, y, Math.round(bw*k), 4, '#ff9a86'); y += 12;
  textC(nCoins + '/' + TOTAL + ' COINS   ' + kills + ' DOWN', y, '#8a7fa0', 1, 1); y += 24;
  textC('SOMETHING IS WAITING', y, C.dim, 1, 1); y += 10;
  textC('AT THE END.', y, C.dim, 1, 1);
  tapLine('TAP TO TRY AGAIN', 1.2);
}
function drawWin(t){
  var y = endTop(t, '242,193,74');
  ctx.globalAlpha = fin(REV + 1.6, 0.6);
  textC('YOU SAW TOO EARLY.', y, C.gold, 1, 1); y += 14;
  ctx.globalAlpha = fin(REV + 2.0, 0.6);
  textC('SOMETHING OPENS IN', y, C.dim, 1, 1);
  ctx.save(); ctx.translate(0, Math.round((1 - fin(REV + 2.2, 0.6)) * 6)); ctx.globalAlpha = fin(REV + 2.2, 0.6);
  drawCountdown(y + 12, t); ctx.restore(); y += 46;
  ctx.globalAlpha = fin(REV + 2.8, 0.6);
  textC('COINS ' + nCoins + '/' + TOTAL, y, '#6d6288', 1, 1);
  ctx.globalAlpha = 1;
  tapLine('TAP TO RUN AGAIN', 4.2);
}
function drawSecret(t){
  var y = endTop(t, '79,195,247');
  ctx.globalAlpha = fin(REV + 1.6, 0.6);
  textC('YOU FOUND', y, C.gold, 2, 1); y += 18;
  textC('THE HIDDEN ROOM', y, C.gold, 1, 1); y += 13;
  ctx.globalAlpha = fin(REV + 2.0, 0.6);
  textC('OMNISCIENT', y, '#4fc3f7', 1, 1); y += 10;
  textC('OMNIPRESENT', y, '#4fc3f7', 1, 1); y += 16;
  ctx.save(); ctx.globalAlpha = fin(REV + 2.3, 0.6); drawCountdown(y, t); ctx.restore(); y += 34;
  ctx.globalAlpha = 1;
  tapLine('TAP TO RUN AGAIN', 4.2);
}

function drawOutro(t){
  var k = clamp(outT / 1.1, 0, 1);
  ctx.globalAlpha = 0.25 + k * 0.5; R(0, 0, VW, VH, '#3a0610'); ctx.globalAlpha = 1;
  drawChaseEye(t, 1 + k * 5);
  ctx.globalAlpha = clamp((outT - 0.55) / 0.5, 0, 1); R(0, 0, VW, VH, '#000000'); ctx.globalAlpha = 1;
}
/* the thing behind him: an eye with the mark's rays, pupil always on him */
function drawChaseEye(t, big, ocx, ocy, oopen, ored){
  var openK = oopen !== undefined ? oopen : eyeOpen;
  if (openK <= 0 && oopen === undefined) return;
  big = big || 1;
  var near = clamp((eyeX + 22) / (HX + 20), 0, 1);
  if (lungeT >= 0) big *= 1 + Math.min(1, lungeT / 1.3) * 0.6;
  var cx = ocx !== undefined ? ocx : eyeX, cy = ocy !== undefined ? ocy : GY - 34 + Math.sin(t * 2.6) * 3;
  var W = 20 * big, H = 12 * big * openK;
  var red = ored !== undefined ? ored : clamp(near * 1.2 + (lungeT >= 0 ? 0.4 : 0), 0, 1);
  var rgb = red > 0.5 ? '255,70,50' : '242,193,74';
  glow(cx, cy, 42 * big, rgb, (0.22 + red * 0.25) * Math.max(0.2, openK));
  /* rays */
  ctx.globalAlpha = (0.35 + red * 0.3) * Math.max(0.1, openK);
  for (var a = 0; a < 18; a++){
    var an = a * Math.PI / 9 + t * 0.4, len = (10 + (a % 3) * 6) * big;
    for (var r = W * 0.95; r < W * 0.95 + len; r += 2 * big)
      R(cx + Math.cos(an) * r, cy + Math.sin(an) * r * 0.75, Math.max(1, big), Math.max(1, big), red > 0.5 ? '#ff6a4c' : C.gold);
  }
  ctx.globalAlpha = 1;
  if (H < 1) return;
  /* white of the eye, veins creeping in as it gets closer */
  for (var i = -W; i <= W; i++){
    var h = Math.round(Math.sqrt(Math.max(0, 1 - (i/W)*(i/W))) * H);
    if (h < 1) continue;
    R(cx + i, cy - h, 1, h * 2, red > 0.6 ? '#f3d6cf' : '#efe9dc');
    R(cx + i, cy - h - 1, 1, 1, '#2b2740'); R(cx + i, cy + h, 1, 1, '#2b2740');
  }
  if (red > 0.3) for (var v = 0; v < 6; v++){
    var vy = cy + (v - 2.5) * H * 0.3, vx = cx + (v % 2 ? W * 0.6 : -W * 0.7);
    ctx.globalAlpha = (red - 0.3); R(vx, vy, Math.max(2, W * 0.2), 1, '#c2263a'); ctx.globalAlpha = 1;
  }
  /* iris and pupil, looking at him */
  var dx = (heroSX + 4) - cx, dy = (hero.y + 6) - cy, dl = Math.max(1, Math.sqrt(dx*dx + dy*dy));
  var ir = Math.min(H * 0.95, 9 * big), ix = cx + dx / dl * W * 0.35, iy = cy + dy / dl * H * 0.3;
  for (i = -ir; i <= ir; i++){
    h = Math.round(Math.sqrt(Math.max(0, ir*ir - i*i)));
    if (h >= 1) R(ix + i, iy - h, 1, h * 2, '#3b4157');
  }
  var pr = ir * (0.45 + red * 0.15);
  for (i = -pr; i <= pr; i++){
    h = Math.round(Math.sqrt(Math.max(0, pr*pr - i*i)));
    if (h >= 1) R(ix + i, iy - h, 1, h * 2, red > 0.6 ? '#ff3b22' : '#12151f');
  }
  R(ix - pr * 0.5, iy - pr * 0.6, Math.max(1, big), Math.max(1, big), '#cdefff');
}
function draw(t){
  if (state === 'over'){ drawOver(t); return; }
  if (state === 'win'){ drawWin(t); return; }
  if (state === 'secret'){ drawSecret(t); return; }
  if (state === 'cut'){ drawCut(t); ctx.globalAlpha = clamp(1 - cutT / 0.6, 0, 1); R(0, 0, VW, VH, '#000000'); ctx.globalAlpha = 1; return; }
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random()-0.5)*shake), Math.round((Math.random()-0.5)*shake));
  if (state === 'kill'){ R(0, 0, VW, VH, '#07040d'); killCamera(); }
  drawBack(t);
  if (state === 'intro') drawDoor(t);
  drawGround();
  drawEnt(t);
  if (state === 'play' || state === 'dead') drawChaseEye(t);
  if (state === 'intro') drawIntroEye(t);
  if (state === 'kill'){ drawKillShade(); drawKill(t); }
  ctx.restore();
  if (state === 'kill') drawKillLens();
  if (flash > 0){ ctx.globalAlpha = flash; R(0, 0, VW, VH, '#ffffff'); ctx.globalAlpha = 1; }
  if (state === 'title') drawTitle(t);
  else if (state === 'intro') drawIntroText();
  else if (state === 'outro') drawOutro(t);
  else if (state !== 'kill') drawHUD(t);
}

/* ---------- loop ------------------------------------------------- */
var last = 0, perf = 0, acc = 0, STEP = 1/120;
function frame(ms){
  requestAnimationFrame(frame);
  if (!last) last = ms;
  var dt = Math.min(0.05, (ms - last) / 1000); last = ms; perf += dt;
  musicTick();
  if (state === 'title'){
    /* the title screen shows the world gliding by, hero running on the spot */
    camX += 40 * dt; hero.anim += dt * 6; hero.y = GY - hero.h; hero.ground = true;
    while (genX < camX + VW + 260) gen();
    /* keep the hero on solid ground in the title scene */
    if (!groundAt(camX + HX) || !groundAt(camX + HX + hero.w)) { segs.push({ a: camX - 50, b: camX + VW + 300 }); }
    stateT += dt;
  } else {
    acc += dt; var guard = 0;
    while (acc >= STEP && guard++ < 10){ update(STEP); acc -= STEP; }
    if (guard >= 10) acc = 0;
  }
  draw(perf);
}

/* debug hooks for testing */
window.__run = {
  st: function(){ return { state:state, t:Math.round(runT*10)/10, total:TOTAL, cutT:Math.round(cutT*10)/10, dist:Math.round(dist), coins:nCoins, kills:kills, y:Math.round(hero.y), gy:GY, vh:VH, alive:hero.alive, secret:secretFound, ground:hero.ground }; },
  press: press, release: release,
  ahead: function(){ return { imps: imps.filter(function(e){return e.alive;}).map(function(e){return Math.round(e.x-camX-HX);}),
                               fires: fires.filter(function(f){return f.live;}).map(function(f){return [Math.round(f.x-camX-HX), Math.round(GY-f.y)];}),
                               gapAhead: (function(){ for (var i=0;i<segs.length;i++){ var d=segs[i].b-camX-HX; if (d>-hero.w && segs[i+1]) return [Math.round(d), Math.round(segs[i+1].a-segs[i].b)]; } return null; })() }; }
};

layout();
newRun();
addEventListener('resize', layout);
addEventListener('orientationchange', function(){ setTimeout(layout, 150); });
requestAnimationFrame(frame);

})();
</script>

</body>
